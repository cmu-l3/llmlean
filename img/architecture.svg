<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" role="img" aria-labelledby="title desc">
  <title id="title">LLMLean: local or cloud models, checked in Lean</title>
  <desc id="desc">llmstep suggests a step, llmqed completes a proof, and llmoptimize rewrites a proof. Lean checks suggestions from cloud models (OpenAI or OpenRouter) or local models (LM Studio or Ollama).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#79909d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Proof environment -->
    <rect x="24" y="83" width="320" height="238" rx="18" fill="#eef8fa" stroke="#b7dce2" stroke-width="1.5"/>
    <g transform="translate(48 109) scale(.13)">
      <path d="M0 0h44v227h264v43H0Z M65 0h44v166h140v41H65Z" fill="#0b1931"/>
      <path d="M129 0h6l85 71 83-71h5v207h-40V81l-48 37-51-41v70h-40Z" fill="#3f73b7"/>
    </g>
    <text x="102" y="135" font-size="26" font-weight="650" fill="#172b3a">LLMLean</text>
    <rect x="48" y="162" width="272" height="104" rx="10" fill="#fff" stroke="#d2e6eb"/>
    <g font-size="15" fill="#536b79">
      <text x="64" y="188"><tspan font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#167d8d">llmstep</tspan><tspan x="190">Suggest a step</tspan></text>
      <text x="64" y="216"><tspan font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#167d8d">llmqed</tspan><tspan x="190">Complete a proof</tspan></text>
      <text x="64" y="244"><tspan font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#167d8d">llmoptimize</tspan><tspan x="190">Rewrite a proof</tspan></text>
    </g>
    <path d="m49 290 5 5 9-10" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="296" font-size="16" fill="#345968">Checked in Lean</text>

    <!-- Each connection carries context out and suggestions back. -->
    <g fill="none" stroke="#79909d" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M354 180H398V106H462"/>
      <path d="M354 224H398V298H462"/>
    </g>

    <!-- Cloud providers -->
    <rect x="472" y="24" width="464" height="164" rx="18" fill="#f7f9fc" stroke="#dce3eb" stroke-width="1.5"/>
    <text x="496" y="59" font-size="17" font-weight="600" fill="#354c60">Cloud models</text>
    <rect x="496" y="80" width="196" height="84" rx="12" fill="#fff" stroke="#dce3eb"/>
    <text x="514" y="114" font-size="22" font-weight="600" fill="#172b3a">OpenAI</text>
    <text x="514" y="141" font-size="14" fill="#617486">Cloud API</text>
    <rect x="708" y="80" width="204" height="84" rx="12" fill="#fff" stroke="#dce3eb"/>
    <text x="726" y="114" font-size="22" font-weight="600" fill="#172b3a">OpenRouter</text>
    <text x="726" y="141" font-size="14" fill="#617486">Cloud API</text>

    <!-- Local providers -->
    <rect x="472" y="216" width="464" height="164" rx="18" fill="#f1faf7" stroke="#cce6dc" stroke-width="1.5"/>
    <text x="496" y="251" font-size="17" font-weight="600" fill="#326454">Local models</text>
    <rect x="496" y="272" width="196" height="84" rx="12" fill="#fff" stroke="#cce6dc"/>
    <text x="514" y="306" font-size="22" font-weight="600" fill="#172b3a">LM Studio</text>
    <text x="514" y="333" font-size="14" fill="#58796d">On your machine</text>
    <rect x="708" y="272" width="204" height="84" rx="12" fill="#fff" stroke="#cce6dc"/>
    <text x="726" y="306" font-size="22" font-weight="600" fill="#172b3a">Ollama</text>
    <text x="726" y="333" font-size="14" fill="#58796d">On your machine</text>
  </g>
</svg>
