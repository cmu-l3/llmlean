<svg xmlns="http://www.w3.org/2000/svg" width="960" height="268" viewBox="0 0 960 268" role="img" aria-labelledby="title desc">
  <title id="title">Context from your Lean project</title>
  <desc id="desc">The current file supplies goals, proof history, earlier declarations and notation. Imported project files supply definitions and lemma statements from direct and transitive imports. LLMLean combines this context into the prompt sent to the language model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#829aa9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="24" y="16" width="338" height="106" rx="14" fill="#142b36" stroke="#315567" stroke-width="1.5"/>
    <text x="46" y="47" font-size="19" font-weight="600" fill="#f0f6fc">Current file</text>
    <text x="46" y="76" font-size="15" fill="#a7bfcb">Current goals and proof so far</text>
    <text x="46" y="100" font-size="15" fill="#a7bfcb">Earlier declarations and notation</text>

    <rect x="24" y="146" width="338" height="106" rx="14" fill="#112923" stroke="#305347" stroke-width="1.5"/>
    <text x="46" y="177" font-size="19" font-weight="600" fill="#f0f6fc">Imported project files</text>
    <text x="46" y="206" font-size="15" fill="#a0c8b6">Definitions and lemma statements</text>
    <text x="46" y="230" font-size="15" fill="#a0c8b6">Direct and transitive imports</text>

    <g fill="none" stroke="#829aa9" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M372 69h42v47h42"/>
      <path d="M372 199h42v-47h42"/>
      <path d="M686 134h62"/>
    </g>

    <rect x="466" y="83" width="210" height="102" rx="14" fill="#151e2b" stroke="#344459" stroke-width="1.5"/>
    <text x="571" y="124" font-size="21" font-weight="600" fill="#f0f6fc" text-anchor="middle">LLMLean</text>
    <text x="571" y="154" font-size="16" fill="#a6b8cd" text-anchor="middle">Builds the prompt</text>

    <rect x="758" y="83" width="178" height="102" rx="14" fill="#151e2b" stroke="#344459" stroke-width="1.5"/>
    <text x="847" y="124" font-size="21" font-weight="600" fill="#f0f6fc" text-anchor="middle">LLM</text>
    <text x="847" y="154" font-size="16" fill="#a6b8cd" text-anchor="middle">Suggests a proof</text>
  </g>
</svg>
